  <line x1="18" y1="30" x2="36" y2="30" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="30" y2="36" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
</svg>
